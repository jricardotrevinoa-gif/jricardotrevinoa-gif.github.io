<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pizarra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Pizarra, de RT. Pizarra infinita: lienzo a sangre completa, controles de cristal flotando encima, naranja RT como única mancha de color de la interfaz. */
:root{
  color-scheme: dark;
  --bg:#0b0b0e;
  --glass:rgba(22,22,27,.62); --glass-strong:rgba(26,26,31,.86); --glass-pop:rgba(24,24,29,.96);
  --glass-2:rgba(255,255,255,.045); --glass-3:rgba(255,255,255,.085); --sunk:rgba(0,0,0,.24);
  --stroke:rgba(255,255,255,.08); --stroke-2:rgba(255,255,255,.15); --hl:rgba(255,255,255,.07);
  --fg:#f2efe9; --fg-2:#ada79e; --fg-3:#78736b;
  --accent:#e86024; --accent-2:#c24a17; --accent-hi:#f0763f; --accent-ink:#1a1614; --accent-soft:rgba(232,96,36,.16); --accent-glow:rgba(232,96,36,.45);
  --danger:#f07158; --ok:#7fd49a;
  --ui:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --blur:blur(22px) saturate(160%);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.5,.64,1);
  --r-sm:8px; --r:11px; --r-lg:16px;
  --gut:max(14px, env(safe-area-inset-left, 0px));
}
body.light{color-scheme:light;
  --bg:#f3f1ec;--glass:rgba(255,255,255,.8);--glass-strong:rgba(255,255,255,.92);--glass-pop:rgba(255,255,255,.98);
  --glass-2:rgba(30,25,20,.045);--glass-3:rgba(30,25,20,.08);--sunk:rgba(30,25,20,.06);
  --stroke:rgba(30,25,20,.09);--stroke-2:rgba(30,25,20,.16);--hl:rgba(255,255,255,.7);
  --fg:#1d1a16;--fg-2:#5c564e;--fg-3:#8d877d;--accent-hi:#c94f17;--accent-soft:rgba(232,96,36,.12)}
body.light .glass,body.light .pop,body.light .box,body.light #toast{box-shadow:inset 0 1px 0 var(--hl),0 14px 40px -18px rgba(40,30,20,.35)}
body.light #modal{background:rgba(40,35,30,.28)}
body.light .tpl canvas{background:#141418}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13.5px/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
body.t-hand #cv,body.panning #cv{cursor:grab}
body.panning.dragging #cv{cursor:grabbing}
body.t-sticky #cv,body.t-shape #cv,body.t-text #cv,body.t-connector #cv,body.t-section #cv,body.t-emoji #cv{cursor:crosshair}
body.t-pen #cv,body.t-marker #cv{cursor:crosshair}
body.t-eraser #cv{cursor:cell}

/* glass primitives */
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--hl),0 18px 50px -20px rgba(0,0,0,.65)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--stroke);background:var(--glass-2);box-shadow:inset 0 1px 0 var(--hl);white-space:nowrap;
  transition:transform .25s var(--spring),background .2s,border-color .2s,box-shadow .25s,color .2s,opacity .2s}
.btn:hover{background:var(--glass-3);border-color:var(--stroke-2)}
.btn:active{transform:scale(.94);transition-duration:.08s}
.btn:disabled{opacity:.3;cursor:default;transform:none}
.btn.icon{width:34px;padding:0}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--fg-2)}
.btn.ghost:hover{background:var(--glass-2);color:var(--fg);border-color:var(--stroke)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 22px -10px var(--accent-glow)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.on{background:var(--accent-soft);color:var(--accent-hi);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.btn svg{width:18px;height:18px}
.kbd{display:inline-block;font:500 10.5px/1.5 var(--ui);border:1px solid var(--stroke-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--fg-2);background:var(--glass-2)}

/* top bar */
.top{position:fixed;left:var(--gut);right:var(--gut);top:calc(12px + env(safe-area-inset-top,0px));z-index:30;display:flex;align-items:center;gap:8px;pointer-events:none}
.top > *{pointer-events:auto}
.cluster{display:flex;align-items:center;gap:2px;padding:4px;border-radius:14px}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 0 8px;user-select:none;height:34px}
.word{position:relative;font:800 21px/1 var(--ui);letter-spacing:-.02em;padding-bottom:2px}
.word i{position:absolute;left:-3px;bottom:-5px;height:4px;width:66%;border-radius:2px;background:var(--accent);transform-origin:left;animation:barIn .7s var(--spring) .3s backwards;transition:width .45s var(--spring)}
.brand:hover .word i{width:calc(100% + 6px)}
@keyframes barIn{from{transform:scaleX(0)}}
.by{display:flex;align-items:center;padding-left:12px;border-left:1px solid var(--stroke);height:22px}
.by img{height:20px;width:auto;display:block;opacity:.9}
.sep{width:1px;height:20px;background:var(--stroke);margin:0 4px;flex:none}
#boardName{height:30px;min-width:60px;width:220px;max-width:32vw;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 9px;font-weight:500;color:var(--fg);text-overflow:ellipsis}
#boardName:hover{border-color:var(--stroke)}
#boardName:focus{outline:none;border-color:var(--accent);background:var(--sunk)}
.spacer{flex:1}
#saveState{font-size:11.5px;color:var(--fg-3);padding:0 8px;white-space:nowrap;transition:color .3s}
#saveState.busy{color:var(--fg-2)}
#timerBtn.run{color:var(--accent-hi);font-variant-numeric:tabular-nums;font-weight:600}
#timerBtn.done{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{background:var(--accent-soft)}}

/* left panel */
#side{position:fixed;left:var(--gut);top:calc(66px + env(safe-area-inset-top,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:256px;z-index:25;border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;
  transform-origin:top left;transition:opacity .2s var(--ease),transform .35s var(--spring)}
#side.closed{opacity:0;transform:translateX(-12px) scale(.98);pointer-events:none}
.side-h{display:flex;align-items:center;gap:6px;padding:12px 12px 8px 14px}
.side-h h3{margin:0;flex:1;font:600 12px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.side-h .btn{height:28px;width:28px}
.side-scroll{overflow:auto;padding:0 8px 10px;flex:1;min-height:0}
.side-scroll::-webkit-scrollbar{width:8px}.side-scroll::-webkit-scrollbar-thumb{background:var(--stroke-2);border-radius:4px;border:2px solid transparent;background-clip:padding-box}
.boards{display:flex;flex-direction:column;gap:4px}
.bcard{display:flex;align-items:center;gap:10px;padding:6px;border-radius:11px;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s;position:relative}
.bcard:hover{background:var(--glass-2)}
.bcard.cur{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.bcard .th{width:62px;height:42px;border-radius:7px;background:var(--sunk);flex:none;object-fit:cover;border:1px solid var(--stroke)}
.bcard .meta{min-width:0;flex:1}
.bcard b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard span{font-size:11.5px;color:var(--fg-3)}
.bcard .more{opacity:0;height:26px;width:26px}
.bcard:hover .more,.bcard.cur .more{opacity:1}
.sections{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.srow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow:hover{background:var(--glass-2);color:var(--fg)}
.srow i{width:10px;height:10px;border-radius:3px;flex:none}
.side-empty{color:var(--fg-3);font-size:12px;padding:6px 10px 10px}

/* dock */
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:2px;padding:5px;border-radius:18px;max-width:calc(100vw - 28px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.tool{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--fg-2);transition:background .15s,color .15s,transform .25s var(--spring);flex:none}
.tool:hover{background:var(--glass-2);color:var(--fg)}
.tool:active{transform:scale(.92)}
.tool.on{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 20px -8px var(--accent-glow)}
.tool svg{width:21px;height:21px}
.tool .sw{position:absolute;right:7px;bottom:7px;width:8px;height:8px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.tool.sticky-tool svg{width:22px;height:22px}
#toolOpts{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(6px);z-index:29;display:flex;align-items:center;gap:4px;padding:6px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .18s var(--ease),transform .3s var(--spring);max-width:calc(100vw - 28px);flex-wrap:wrap;justify-content:center}
#toolOpts.in{opacity:1;transform:translateX(-50%);pointer-events:auto}

/* context toolbar */
#ctx{position:fixed;left:0;top:0;z-index:28;display:flex;align-items:center;gap:2px;padding:4px;border-radius:13px;opacity:0;pointer-events:none;transition:opacity .14s var(--ease);white-space:nowrap}
#ctx.in{opacity:1;pointer-events:auto}
#ctx .btn{height:32px;min-width:32px;padding:0 7px;border-radius:9px}
#ctx .btn svg{width:17px;height:17px}
#ctx .sep{height:18px;margin:0 3px}
.chip{width:18px;height:18px;border-radius:6px;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.chip.none{background:conic-gradient(from 45deg,transparent 0 25%,rgba(255,255,255,.12) 0 50%,transparent 0 75%,rgba(255,255,255,.12) 0) 0 0/8px 8px;position:relative}
.chip.none::after{content:"";position:absolute;inset:-1px;background:linear-gradient(135deg,transparent 46%,var(--danger) 46% 54%,transparent 54%)}
.chip.ring{background:transparent!important;border-width:3px}
.lbl{font-size:12px;color:var(--fg-2);padding:0 2px}

/* popovers / menus */
.pop{position:fixed;z-index:40;background:var(--glass-pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--stroke-2);border-radius:14px;box-shadow:inset 0 1px 0 var(--hl),0 24px 60px rgba(0,0,0,.6);padding:6px;min-width:180px;
  opacity:0;transform:translateY(-4px) scale(.97);transition:opacity .16s var(--ease),transform .28s var(--spring)}
.pop.in{opacity:1;transform:none}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left;color:var(--fg);white-space:nowrap}
.mi:hover,.mi.act{background:var(--glass-3)}
.mi svg{width:16px;height:16px;color:var(--fg-2)}
.mi .k{margin-left:auto;padding-left:18px;color:var(--fg-3);font-size:11.5px}
.mi.danger{color:var(--danger)}
.mi.danger svg{color:var(--danger)}
.mi:disabled{opacity:.35;cursor:default;background:none}
.msep{height:1px;background:var(--stroke);margin:5px 4px}
.mh{font:600 10.5px/1 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:8px 10px 6px}
.swatches{display:grid;grid-template-columns:repeat(8,26px);gap:6px;padding:6px}
.swatch{width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .2s var(--spring)}
.swatch:hover{transform:scale(1.12)}
.swatch.cur{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--sunk)}
.seg button{height:28px;min-width:30px;padding:0 8px;border-radius:7px;color:var(--fg-2);display:grid;place-items:center;font-size:12px;font-weight:500}
.seg button svg{width:16px;height:16px}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--glass-3);color:var(--fg);box-shadow:inset 0 1px 0 var(--hl)}
.row{display:flex;align-items:center;gap:8px;padding:4px 6px}
.row > span{font-size:12px;color:var(--fg-2);min-width:58px}
.emojis{display:grid;grid-template-columns:repeat(8,34px);gap:2px;padding:4px}
.emojis button{width:34px;height:34px;border-radius:8px;font-size:21px;display:grid;place-items:center;transition:transform .2s var(--spring),background .15s}
.emojis button:hover{background:var(--glass-3);transform:scale(1.15)}
.emojis button.cur{background:var(--accent-soft)}

/* zoom + minimap */
#nav{position:fixed;right:var(--gut);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mini{width:200px;height:130px;border-radius:13px;overflow:hidden;cursor:pointer;transition:opacity .2s,transform .3s var(--spring);transform-origin:bottom right}
#mini.closed{opacity:0;transform:scale(.9);pointer-events:none}
#mini canvas{width:100%;height:100%;display:block}
#zoombar{display:flex;align-items:center;gap:2px;padding:4px;border-radius:13px}
#zoombar .btn{height:32px}
#zoomPct{min-width:58px;font-variant-numeric:tabular-nums;font-size:12.5px}

/* text editor overlay */
#edWrap{position:fixed;left:0;top:0;z-index:20;transform-origin:0 0;display:flex;pointer-events:auto}
#ed{outline:none;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;caret-color:var(--accent);min-width:2px;width:100%;cursor:text}
#ed::selection{background:rgba(232,96,36,.35)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,5,8,.52);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:50;padding:20px var(--gut);opacity:0;transition:opacity .22s var(--ease)}
#modal.in{opacity:1}
.box{background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--stroke-2);border-radius:18px;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 1px 0 var(--hl),0 30px 80px rgba(0,0,0,.6);transform:translateY(10px) scale(.96);transition:transform .4s var(--spring)}
.box.wide{width:min(980px,100%)}
#modal.in .box{transform:none}
.box h2{margin:0;font:800 26px/1.1 var(--ui);letter-spacing:-.02em}
.box-h p{margin-top:6px}
.opts{display:flex;flex-direction:column;gap:4px}
.box p{margin:0;color:var(--fg-2)}
.box-h{display:flex;align-items:flex-start;gap:12px}
.box-h > div{flex:1}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.keys span:nth-child(odd){color:var(--fg-2)}
.keys span:nth-child(even){text-align:right;white-space:nowrap}
.keycols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 30px}
.keycols h4{margin:0 0 8px;font:600 11px/1 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tpl{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass-2);text-align:left;transition:transform .3s var(--spring),border-color .2s,background .2s}
.tpl:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--glass-3)}
.tpl canvas{width:100%;aspect-ratio:16/10;border-radius:9px;background:#141418;display:block}
.tpl b{font-weight:600;padding:0 4px}
.tpl span{font-size:12px;color:var(--fg-3);padding:0 4px 4px;line-height:1.35}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:12px;color:var(--fg-2)}
.credit{display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--stroke)}
.credit img{height:28px}
.credit b{display:block;font-weight:600}
.credit span{color:var(--fg-3);font-size:12px}
.preview{width:100%;max-height:40vh;object-fit:contain;border-radius:10px;background:var(--sunk);display:block}

/* toast + tip */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--stroke-2);box-shadow:inset 0 1px 0 var(--hl),0 16px 40px rgba(0,0,0,.55);font-weight:500;max-width:calc(100% - 32px);
  opacity:0;transform:translate(-50%,18px) scale(.95);pointer-events:none;transition:opacity .22s var(--ease),transform .4s var(--spring)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#toast .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 10px var(--accent-glow)}
#toast .msg{padding-right:6px}
#toast .btn{height:28px;font-size:12px;padding:0 10px;border-radius:9px}
#toast .msg:last-child{padding-right:8px}
#tip{position:fixed;z-index:70;left:0;top:0;padding:6px 9px;border-radius:9px;background:rgba(20,20,24,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--stroke-2);font-size:11.5px;color:var(--fg);white-space:nowrap;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5);
  opacity:0;transform:translateY(4px);transition:opacity .15s var(--ease),transform .2s var(--ease)}
#tip.show{opacity:1;transform:none}
#tip .kbd{margin-left:6px}
#drop{position:fixed;inset:10px;border:2px dashed var(--accent);border-radius:20px;z-index:45;display:grid;place-items:center;background:rgba(232,96,36,.06);pointer-events:none;opacity:0;transition:opacity .15s}
#drop.in{opacity:1}
#drop b{padding:10px 16px;border-radius:12px;background:var(--glass-pop);border:1px solid var(--stroke-2)}

/* entrance */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes riseDock{from{opacity:0;transform:translate(-50%,14px)}}
.top{animation:rise .5s var(--ease) backwards}
#dock{animation:riseDock .6s var(--spring) .1s backwards}
#nav{animation:rise .6s var(--ease) .18s backwards}

@media (max-width: 900px){ .hide-md{display:none!important} #boardName{width:150px} }
@media (max-width: 640px){
  .hide-sm{display:none!important}
  #side{width:min(280px,calc(100vw - 28px))}
  #boardName{width:96px}
  .brand{padding:0 6px}
  .word{font-size:18px}
  #mini{display:none}
  #dock{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .tool{width:38px;height:38px}
  #nav{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  #toolOpts{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}
@media (max-width: 460px){ #boardName{display:none} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body class="t-select">
<canvas id="cv" tabindex="0" aria-label="Lienzo de la pizarra"></canvas>

<header class="top">

/* fábricas */
function make(type,p={}){
  const base={id:uid(),type,x:0,y:0,w:100,h:100};
  let d;
  switch(type){
    case 'sticky': d={w:200,h:200,color:PREFS.stickyColor,text:'',fs:'auto',align:'center',font:PREFS.font,bold:false};break;
    case 'shape': {const k=p.kind||PREFS.shapeKind;const sq=['ellipse','diamond','star','hexagon','triangle'].includes(k);
      d={kind:k,w:sq?160:200,h:sq?160:120,fill:PREFS.shape.fill,stroke:PREFS.shape.stroke,sw:PREFS.shape.sw,text:'',fs:18,align:'center',font:PREFS.font,bold:false,tc:'auto'};break}
    case 'text': d={w:20,h:32,text:'',fs:24,color:'auto',align:'left',font:PREFS.font,bold:false,fixedW:false};break;
    case 'section': d={w:800,h:560,title:'Sección',color:'#7c5cff'};break;
    case 'path': d={pts:[],color:PREFS.pen.color,sw:PREFS.pen.sw,hl:false};break;
    case 'conn': d={a:{x:0,y:0},b:{x:100,y:0},style:PREFS.conn.style,color:PREFS.conn.color,sw:PREFS.conn.sw,dash:PREFS.conn.dash,start:PREFS.conn.start,end:PREFS.conn.end,label:''};break;
    case 'image': d={asset:null,w:300,h:200};break;
    case 'emoji': d={ch:PREFS.emoji,w:72,h:72};break;
  }
  return Object.assign(base,d,p);
}

/* ───────── historial ───────── */
const H={stack:[],idx:-1};
const snap=()=>JSON.stringify(objs());
function histReset(){H.stack=[snap()];H.idx=0;updateUndo()}
function commit(){
  const s=snap();
  if(H.stack[H.idx]===s){afterChange();return}
  H.stack=H.stack.slice(0,H.idx+1);H.stack.push(s);
  if(H.stack.length>200)H.stack.shift();
  H.idx=H.stack.length-1;
  afterChange();
}
function undo(){if(S.editing)endEdit();if(H.idx<=0)return;H.idx--;restore()}
function redo(){if(S.editing)endEdit();if(H.idx>=H.stack.length-1)return;H.idx++;restore()}
function restore(){S.board.objects=JSON.parse(H.stack[H.idx]);reindex();afterChange()}
function updateUndo(){$('#undo').disabled=H.idx<=0;$('#redo').disabled=H.idx>=H.stack.length-1}

let saveTimer=null;
function afterChange(){
  reindex();updateUndo();invalidate();
  scheduleSave();refreshSections();scheduleCtx();
}

/* ───────── almacenamiento (IndexedDB con respaldo en memoria) ───────── */
const DB={
  db:null, mem:{boards:new Map(),meta:new Map()},
  open(){return new Promise(res=>{
    try{const r=indexedDB.open('pizarra-rt',1);
      r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('boards'))d.createObjectStore('boards',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'id'})};
      r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false);
    }catch(e){res(false)}})},
  req(store,mode,fn){
    if(!this.db){const m=this.mem[store];return Promise.resolve(fn({get:id=>({result:m.get(id)}),getAll:()=>({result:[...m.values()]}),put:v=>{m.set(v.id,JSON.parse(JSON.stringify(v)));return{}},delete:id=>{m.delete(id);return{}}}).result)}
    return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(s,id){return this.req(s,'readonly',st=>st.get(id))},
  all(s){return this.req(s,'readonly',st=>st.getAll())},
  put(s,v){return this.req(s,'readwrite',st=>st.put(v))},
  del(s,id){return this.req(s,'readwrite',st=>st.delete(id))},
};

function setSaveState(t,busy){const el=$('#saveState');el.textContent=t;el.classList.toggle('busy',!!busy)}
function scheduleSave(){setSaveState('Guardando…',true);clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500)}
async function saveNow(){
  clearTimeout(saveTimer);saveTimer=null;
  const b=S.board;if(!b)return;
  b.updated=Date.now();b.cam={...S.cam};
  try{
    await DB.put('boards',b);
    const meta={id:b.id,name:b.name,updated:b.updated,count:b.objects.length,thumb:makeThumb(b)};
    await DB.put('meta',meta);
    const i=S.metas.findIndex(m=>m.id===b.id);if(i>=0)S.metas[i]=meta;else S.metas.unshift(meta);
    renderBoards();
    setSaveState(DB.db?'Guardado':'Sin guardado local',false);
  }catch(e){console.error(e);setSaveState('No se pudo guardar',false);toast('No se pudo guardar: el navegador no tiene espacio o bloquea el almacenamiento.')}
}
function gcAssets(b){
  const used=new Set(b.objects.filter(o=>o.type==='image').map(o=>o.asset));
  for(const k of Object.keys(b.assets||{}))if(!used.has(k))delete b.assets[k];
}
function loadAssets(b){
  for(const [k,src] of Object.entries(b.assets||{})){
    if(IMG.has(k))continue;const im=new Image();im.onload=()=>invalidate();im.src=src;IMG.set(k,im);
  }
}
async function openBoard(id,{fit}={}){
  if(S.editing)endEdit();
  if(saveTimer)await saveNow();
  let b=await DB.get('boards',id);
  if(!b){b=newBoard();await DB.put('boards',b)}
  b.objects=b.objects||[];b.assets=b.assets||{};
  gcAssets(b);loadAssets(b);
  S.board=b;S.sel.clear();reindex();
  PREFS.last=b.id;savePrefs();
  $('#boardName').value=b.name;
  applyTheme();
  if(b.cam&&!fit)S.cam={...b.cam};else zoomToFit(false);
  histReset();invalidate();renderBoards();refreshSections();scheduleCtx();
  setSaveState('Guardado');
}
async function createBoard(name,objects){
  if(saveTimer)await saveNow();
  const b=newBoard(name);if(objects)b.objects=objects;
  await DB.put('boards',b);
  S.metas.unshift({id:b.id,name:b.name,updated:b.updated,count:0,thumb:''});
  await openBoard(b.id,{fit:!!objects});
  if(objects)saveNow();
  return b;
}

/* ───────── texto ───────── */
const mctx=document.createElement('canvas').getContext('2d');
const LH={sans:1.25,hand:1.08,mono:1.35};
const LCACHE=new Map();
const fontOf=(o,fs)=>`${o.bold?700:(o.font==='hand'?500:400)} ${fs}px ${FONTS[o.font||'sans']}`;
function layout(text,font,fs,maxW,lhm){
  const key=text+'\u0001'+font+'\u0001'+maxW;
  let L=LCACHE.get(key);if(L)return L;
  if(LCACHE.size>4000)LCACHE.clear();
  mctx.font=font;const M=t=>mctx.measureText(t).width;
  const lines=[];let broke=false;
  for(const para of String(text).split('\n')){
    if(maxW==null){lines.push(para);continue}
    const toks=para.match(/\S+\s*/g)||[''];
    let line=(para.match(/^\s+/)||[''])[0];
    for(const tok of toks){
      const cand=line+tok;
      if(M(cand.trimEnd())<=maxW){line=cand;continue}
      if(line.trim()){lines.push(line.trimEnd());line=''}
      if(M(tok.trimEnd())<=maxW){line=tok;continue}
      broke=true;let s='';
      for(const ch of tok){if(M((s+ch).trimEnd())>maxW&&s){lines.push(s);s=ch}else s+=ch}
      line=s;
    }
    lines.push(line.trimEnd());
  }
  const ws=lines.map(M);
  L={lines,ws,broke,w:Math.max(0,...ws),h:lines.length*fs*lhm,lh:fs*lhm};
  LCACHE.set(key,L);return L;
}
const FITCACHE=new Map();
function stickyPad(o){return Math.min(o.w,o.h)*.08+6}
function stickyFs(o){
  if(o.fs!=='auto')return o.fs;
  const key=[o.text,o.w,o.h,o.font,o.bold].join('\u0001');
  let f=FITCACHE.get(key);if(f)return f;
  if(FITCACHE.size>3000)FITCACHE.clear();
  const pad=stickyPad(o),mw=o.w-2*pad,mh=o.h-2*pad,lhm=LH[o.font]||1.25;
  const t=o.text||'M';
  f=6;
  for(let fs=Math.min(o.w,o.h)*.2;fs>=6;fs*=.92){
    const L=layout(t,fontOf(o,fs),fs,mw,lhm);
    if(!L.broke&&L.h<=mh){f=fs;break}
    if(fs*.92<6){f=6}
  }
  FITCACHE.set(key,f);return f;
}
function drawText(c,o,text,box,fs,color,align,valign){
  if(!text)return;
  const lhm=LH[o.font]||1.25,font=fontOf(o,fs);
  let L=layout(text,font,fs,box.w,lhm);
  if(L.broke&&o.type==='shape'){mctx.font=font;const ww=Math.max(...String(text).split(/\s+/).map(t=>mctx.measureText(t).width));L=layout(text,font,fs,Math.max(box.w,ww+1),lhm)}
  c.font=font;c.fillStyle=color;c.textBaseline='middle';
  let y=box.y+(valign==='middle'?(box.h-L.h)/2:0);
  c.textAlign=align;
  const x=align==='center'?box.x+box.w/2:align==='right'?box.x+box.w:box.x;
  const off=o.font==='hand'?fs*.06:fs*.02;
  for(const ln of L.lines){c.fillText(ln,x,y+L.lh/2+off);y+=L.lh}
}

  let set=s.length===1?handleSet(s[0]):(s.some(o=>o.locked)?[]:['nw','ne','se','sw']);
  if(S.editing)set=[];
  const r=rToScreen(selBox());if(!r)return[];
  if(r.w<26||r.h<26)set=set.filter(k=>k.length===2);
  const P={nw:[0,0],n:[.5,0],ne:[1,0],e:[1,.5],se:[1,1],s:[.5,1],sw:[0,1],w:[0,.5]};
  return set.map(k=>({k,x:r.x+r.w*P[k][0],y:r.y+r.h*P[k][1]}));
}
function quickAdds(){
  if(S.tool!=='select'||S.editing||drag)return[];
  const s=selected();if(s.length!==1)return[];const o=s[0];
  if(o.locked||!(o.type==='sticky'||o.type==='shape'))return[];
  const r=rToScreen(bounds(o));if(r.w<30||r.h<30)return[];
  const d=24;
  return[{k:'r',x:r.x+r.w+d,y:r.y+r.h/2},{k:'b',x:r.x+r.w/2,y:r.y+r.h+d},{k:'l',x:r.x-d,y:r.y+r.h/2},{k:'t',x:r.x+r.w/2,y:r.y-d}];
}
function sectionTitleRect(o){
  const p=toScreen(o.x,o.y);mctx.font='600 12.5px Outfit, system-ui, sans-serif';
  const t=o.title||'Sección';const w=Math.min(mctx.measureText(t).width+20,Math.max(60,o.w*S.cam.z));
  return{x:p.x,y:p.y-30,w,h:24,t};
}
function drawOverlay(c){
  const T=theme(),A=T.sel,z=S.cam.z;
  c.setTransform(DPR,0,0,DPR,0,0);
  // títulos de sección
  for(const o of objs()){if(o.type!=='section')continue;const b=rToScreen(o);if(b.x>VW||b.y>VH+30||b.x+b.w<0||b.y+b.h<-30)continue;
    const r=sectionTitleRect(o);if(S.editing===o.id)continue;
    c.fillStyle=o.color;c.beginPath();rrect(c,r.x,r.y,r.w,r.h,7);c.fill();
    c.save();c.beginPath();c.rect(r.x,r.y,r.w-6,r.h);c.clip();
    c.fillStyle=inkFor(o.color);c.font='600 12.5px Outfit, system-ui, sans-serif';c.textBaseline='middle';c.textAlign='left';c.fillText(r.t,r.x+10,r.y+r.h/2+1);c.restore()}
  const outline=(o,w=1.5,alpha=1)=>{
    c.globalAlpha=alpha;c.strokeStyle=A;c.lineWidth=w;
    if(o.type==='conn'){c.save();c.setTransform(DPR*z,0,0,DPR*z,-S.cam.x*z*DPR,-S.cam.y*z*DPR);const R=route(o);c.beginPath();const ps=routePoly(R);c.moveTo(ps[0].x,ps[0].y);for(const p of ps)c.lineTo(p.x,p.y);c.lineWidth=(o.sw+4/z);c.strokeStyle=rgba('#e86024',.35);c.stroke();c.restore()}
    else if(o.type==='section'){const r=sectionTitleRect(o);c.beginPath();rrect(c,r.x-1,r.y-1,r.w+2,r.h+2,8);c.stroke();const b=rToScreen(o);c.beginPath();rrect(c,b.x,b.y,b.w,b.h,12*z);c.stroke()}
    else{const b=rToScreen(bounds(o));c.strokeRect(b.x,b.y,b.w,b.h)}
    c.globalAlpha=1;
  };
  if(S.hover&&!S.sel.has(S.hover)&&!drag&&!S.editing){const o=get(S.hover);if(o&&(o.type!=='section'||S.hoverPart==='title'))outline(o,1.5,.7)}
  const sel=selected();
  for(const o of sel)outline(o,sel.length>1?1:1.5);
  if(sel.length>1){const r=rToScreen(selBox());c.strokeStyle=A;c.lineWidth=1.5;c.strokeRect(r.x,r.y,r.w,r.h)}
  if(sel.length&&!(drag&&drag.mode==='move')){
    for(const h of handles()){
      c.beginPath();
      if(h.k==='ca'||h.k==='cb'){c.arc(h.x,h.y,6,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.lineWidth=2;c.strokeStyle=A;c.stroke()}
      else{c.rect(h.x-HS/2,h.y-HS/2,HS,HS);c.fillStyle='#fff';c.fill();c.lineWidth=1.5;c.strokeStyle=A;c.stroke()}
    }
    for(const q of quickAdds()){
      const hot=S.hoverPart==='qa:'+q.k;
      c.beginPath();c.arc(q.x,q.y,hot?11:9,0,Math.PI*2);c.fillStyle=hot?A:rgba('#e86024',.9);c.fill();
      c.strokeStyle='#fff';c.lineWidth=1.8;c.beginPath();c.moveTo(q.x-4,q.y);c.lineTo(q.x+4,q.y);c.moveTo(q.x,q.y-4);c.lineTo(q.x,q.y+4);c.stroke();
    }
    if(sel.length===1&&sel[0].locked){const b=rToScreen(bounds(sel[0]));c.fillStyle=A;c.beginPath();rrect(c,b.x+b.w-22,b.y-24,22,20,5);c.fill();c.strokeStyle='#fff';c.lineWidth=1.4;c.strokeRect(b.x+b.w-16,b.y-15,10,7);c.beginPath();c.arc(b.x+b.w-11,b.y-15,3,Math.PI,0);c.stroke()}
  }
  // anclas de conexión
  if(S.anchorHover){const o=get(S.anchorHover.id);if(o){
    const b=rToScreen(bounds(o));c.strokeStyle=A;c.lineWidth=2;c.beginPath();if(o.type==='section')rrect(c,b.x,b.y,b.w,b.h,12*z);else c.rect(b.x,b.y,b.w,b.h);c.stroke();
    for(const s of ['t','r','b','l']){const p=anchorPt(o,s),q=toScreen(p.x,p.y),on=S.anchorHover.side===s;c.beginPath();c.arc(q.x,q.y,on?7:5,0,Math.PI*2);c.fillStyle=on?A:'#fff';c.fill();c.strokeStyle=A;c.lineWidth=2;c.stroke()}
  }}
  if(S.marquee){const r=rToScreen(S.marquee);c.fillStyle=rgba('#e86024',.08);c.fillRect(r.x,r.y,r.w,r.h);c.strokeStyle=A;c.lineWidth=1;c.strokeRect(r.x+.5,r.y+.5,r.w,r.h)}
  if(S.guides.length){c.strokeStyle='#ff3d8b';c.lineWidth=1;c.beginPath();
    for(const g of S.guides){if(g.x!=null){const a=toScreen(g.x,g.y1),b=toScreen(g.x,g.y2);c.moveTo(Math.round(a.x)+.5,a.y);c.lineTo(Math.round(b.x)+.5,b.y)}else{const a=toScreen(g.x1,g.y),b=toScreen(g.x2,g.y);c.moveTo(a.x,Math.round(a.y)+.5);c.lineTo(b.x,Math.round(a.y)+.5)}}c.stroke()}
  if(S.tool==='eraser'&&S.pointer.in){c.beginPath();c.arc(S.pointer.x,S.pointer.y,10,0,Math.PI*2);c.strokeStyle=T.ink;c.globalAlpha=.6;c.lineWidth=1.5;c.stroke();c.globalAlpha=1}
}

/* ───────── ciclo de dibujo ───────── */
let raf=0;
function invalidate(){if(!raf)raf=requestAnimationFrame(frame)}
function frame(){
  raf=0;if(!S.board)return;
  const list=S.preview?objs().concat(S.preview):objs();
  drawScene(ctx,list,S.cam,VW,VH,{dpr:DPR,index:S.preview?new Map([...S.byId,[S.preview.id,S.preview]]):null});
  drawOverlay(ctx);
  $('#zoomPct').textContent=Math.round(S.cam.z*100)+'%';
  positionEditor();positionCtx();drawMiniSoon();
}

/* miniatura de un conjunto de objetos */
function sceneBounds(list,idx){LOOK=idx||new Map(list.map(o=>[o.id,o]));const r=unionRects(list.map(o=>{const b=bounds(o);return o.type==='section'?{x:b.x,y:b.y-40,w:b.w,h:b.h+40}:b}).filter(Boolean));LOOK=null;return r}
function renderObjects(list,W,H,{pad=24,bgOn=true,index=null,maxZ=1}={}){
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const idx=index||new Map(list.map(o=>[o.id,o]));
  const r=sceneBounds(list,idx);
  if(!r){if(bgOn){g.fillStyle=theme().bg;g.fillRect(0,0,W,H)}return c}
  const z=Math.min((W-2*pad)/Math.max(r.w,1),(H-2*pad)/Math.max(r.h,1),maxZ);
  const cam={x:r.x+r.w/2-W/2/z,y:r.y+r.h/2-H/2/z,z};
  const ed=S.editing;S.editing=null;
  drawScene(g,list,cam,W,H,{dpr:1,bg:bgOn,grid:false,index:idx,titles:true});
  S.editing=ed;
  return c;
}
function makeThumb(b){
  try{if(!b.objects.length)return'';const c=renderObjects(b.objects,240,156,{pad:12});return c.toDataURL('image/jpeg',.72)}catch(e){return''}
}

/* ───────── detección de impactos ───────── */
const inRect=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
function hitOne(o,p,tol){
  switch(o.type){
    case 'conn':{const R=route(o),ps=routePoly(R);for(let i=1;i<ps.length;i++)if(segDist(p,ps[i-1],ps[i])<=tol+o.sw/2+2/S.cam.z)return true;const lr=labelRect(o);return!!(lr&&inRect(p,lr))}
    case 'path':{if(!inRect(p,inflate(bounds(o),tol)))return false;const q=o.pts;if(q.length===2)return Math.hypot(p.x-q[0],p.y-q[1])<=tol+o.sw/2;
      for(let i=2;i<q.length;i+=2)if(segDist(p,{x:q[i-2],y:q[i-1]},{x:q[i],y:q[i+1]})<=tol+o.sw/2)return true;return false}
    case 'shape':{if(!inRect(p,inflate(o,tol+o.sw)))return false;shapePath(mctx,o.kind,o.x,o.y,o.w,o.h);
      if(o.fill!=='none'||o.text)if(mctx.isPointInPath(p.x,p.y))return true;
      mctx.lineWidth=Math.max(o.sw,1)+tol*2;return mctx.isPointInStroke(p.x,p.y)}
    default:return inRect(p,inflate(bounds(o),tol*.5));
  }
}
function hitObj(wx,wy,{skipSections=false,filter=null}={}){
  const tol=6/S.cam.z,p={x:wx,y:wy},L=objs();
  for(let i=L.length-1;i>=0;i--){const o=L[i];if(o.type==='section'||(filter&&!filter(o)))continue;if(hitOne(o,p,tol))return{o,part:'body'}}
  if(skipSections)return null;
  const sp=toScreen(wx,wy);
  for(let i=L.length-1;i>=0;i--){const o=L[i];if(o.type!=='section'||(filter&&!filter(o)))continue;if(inRect(sp,sectionTitleRect(o)))return{o,part:'title'}}
  for(let i=L.length-1;i>=0;i--){const o=L[i];if(o.type!=='section'||(filter&&!filter(o)))continue;if(inRect(p,o))return{o,part:'body'}}
  return null;
}
const attachable=o=>o.type!=='conn'&&o.type!=='path';
function nearestSide(o,p){let best=null,bd=Infinity;for(const s of ['t','r','b','l']){const a=anchorPt(o,s),d=dist(a,p);if(d<bd){bd=d;best=s}}return bd<=18/S.cam.z?best:null}

/* ───────── herramientas ───────── */
let drag=null,spaceDown=false;const pointers=new Map();
const TOOLS=['select','hand','sticky','shape','text','connector','section','pen','marker','eraser','emoji'];
function setTool(t){
  if(S.editing&&t!=='select')endEdit();
  S.tool=t;S.anchorHover=null;
  document.body.className=document.body.className.replace(/\bt-\w+/g,'').trim()+' t-'+t;
  renderDock();renderToolOpts();invalidate();
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function addObj(o,{select=true}={}){objs().push(o);S.byId.set(o.id,o);if(select)S.sel=new Set([o.id]);return o}
function placeCenter(){return toWorld(VW/2,VH/2)}

/* traslación, escalado */
function translateObj(o,orig,dx,dy){
  if(o.type==='conn'){if(!orig.a.id)o.a={x:orig.a.x+dx,y:orig.a.y+dy};if(!orig.b.id)o.b={x:orig.b.x+dx,y:orig.b.y+dy};return}
  o.x=orig.x+dx;o.y=orig.y+dy;
  if(o.type==='path')o.pts=orig.pts.map((v,i)=>v+(i%2?dy:dx));
}
function scaleObj(o,orig,box,nb,{fontScale=1,edge=false}={}){
  const sx=nb.w/(box.w||1),sy=nb.h/(box.h||1);
  const mx=v=>nb.x+(v-box.x)*sx,my=v=>nb.y+(v-box.y)*sy;
  if(o.type==='conn'){if(!orig.a.id)o.a={x:mx(orig.a.x),y:my(orig.a.y)};if(!orig.b.id)o.b={x:mx(orig.b.x),y:my(orig.b.y)};return}
  if(o.type==='path'){o.pts=orig.pts.map((v,i)=>i%2?my(v):mx(v));o.sw=Math.max(1,orig.sw*Math.min(sx,sy));pathBounds(o);return}
  o.x=mx(orig.x);o.y=my(orig.y);o.w=Math.max(4,orig.w*sx);o.h=Math.max(4,orig.h*sy);
  if(o.type==='text'){
    if(edge){o.fixedW=true;o.fs=orig.fs;o.w=Math.max(o.fs,o.w);textAutoSize(o)}
    else{o.fs=Math.max(4,orig.fs*fontScale);o.fixedW=orig.fixedW;if(orig.fixedW)o.w=orig.w*fontScale;textAutoSize(o)}
  }else if(fontScale!==1){if(typeof orig.fs==='number')o.fs=Math.max(4,orig.fs*fontScale);if(o.type==='shape')o.sw=orig.sw*fontScale}
}

/* contenido de una sección */
function sectionChildren(sec,exclude){const out=[];for(const c of objs()){if(c.id===sec.id||(exclude&&exclude.has(c.id)))continue;const b=bounds(c);if(b&&rectIn(sec,b))out.push(c)}return out}

/* guías inteligentes */
function snapTargets(ids){
  const xs=[],ys=[],view=inflate(viewRect(),200);
  for(const o of objs()){if(ids.has(o.id)||o.type==='conn'||o.type==='path')continue;const b=bounds(o);if(!rectsHit(b,view))continue;
    for(const v of [b.x,b.x+b.w/2,b.x+b.w])xs.push({v,a:b.y,b:b.y+b.h});
    for(const v of [b.y,b.y+b.h/2,b.y+b.h])ys.push({v,a:b.x,b:b.x+b.w});}
  return{xs,ys};
}
function snapMove(box,dx,dy,T){
  const thr=6/S.cam.z;let bx=null,by=null;
  const nx=[box.x+dx,box.x+dx+box.w/2,box.x+dx+box.w],ny=[box.y+dy,box.y+dy+box.h/2,box.y+dy+box.h];
  for(const t of T.xs)for(const v of nx){const d=t.v-v;if(Math.abs(d)<thr&&(!bx||Math.abs(d)<Math.abs(bx.d)))bx={d,t}}
  for(const t of T.ys)for(const v of ny){const d=t.v-v;if(Math.abs(d)<thr&&(!by||Math.abs(d)<Math.abs(by.d)))by={d,t}}
  if(bx)dx+=bx.d;if(by)dy+=by.d;
  const G=[],nb={x:box.x+dx,y:box.y+dy,w:box.w,h:box.h};
  if(bx){for(const t of T.xs)if(Math.abs(t.v-(nb.x))<.01||Math.abs(t.v-(nb.x+nb.w/2))<.01||Math.abs(t.v-(nb.x+nb.w))<.01)G.push({x:t.v,y1:Math.min(t.a,nb.y),y2:Math.max(t.b,nb.y+nb.h)})}
  if(by){for(const t of T.ys)if(Math.abs(t.v-(nb.y))<.01||Math.abs(t.v-(nb.y+nb.h/2))<.01||Math.abs(t.v-(nb.y+nb.h))<.01)G.push({y:t.v,x1:Math.min(t.a,nb.x),x2:Math.max(t.b,nb.x+nb.w)})}
  return{dx,dy,G};
}

/* ───────── puntero ───────── */
function spt(e){return{x:e.clientX,y:e.clientY}}
cv.addEventListener('mousedown',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(S.editing)endEdit();
  closePops();
  cv.focus({preventScroll:true});
  pointers.set(e.pointerId,spt(e));
  if(pointers.size===2){
    if(drag&&drag.mode==='draw'||drag&&drag.mode==='create'||drag&&drag.mode==='connect'){S.preview=null}
    if(drag&&drag.mode==='move'&&drag.items){for(const it of drag.items)Object.assign(it.o,clone(it.orig))}
    const [p1,p2]=[...pointers.values()];
    drag={mode:'pinch',d0:dist(p1,p2),c0:{x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2},cam:{...S.cam}};
    S.marquee=null;S.guides=[];invalidate();return;
  }
  if(pointers.size>2)return;
  const sp=spt(e),wp=toWorld(sp.x,sp.y);
  if(e.button===2)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(e.button===1||(e.button===0&&(spaceDown||S.tool==='hand'))){
    e.preventDefault();drag={mode:'pan',s:sp,cam:{...S.cam}};document.body.classList.add('panning','dragging');return;
  }
  if(e.button!==0)return;
  switch(S.tool){
    case 'select':downSelect(e,sp,wp);break;
    case 'sticky':{const o=make('sticky');o.x=wp.x-o.w/2;o.y=wp.y-o.h/2;addObj(o);commit();setTool('select');startEdit(o);break}
    case 'text':{
      const h=hitObj(wp.x,wp.y,{skipSections:true});
      if(h&&h.o.type==='text'){S.sel=new Set([h.o.id]);setTool('select');startEdit(h.o);break}
      const o=make('text');o.x=wp.x;o.y=wp.y-o.fs*.65;textAutoSize(o);addObj(o);setTool('select');startEdit(o,{fresh:true});break}
    case 'shape':case 'section':{
      const o=make(S.tool==='shape'?'shape':'section',{x:wp.x,y:wp.y,w:0,h:0});
      S.preview=o;drag={mode:'create',start:wp,o,sp};break}
    case 'connector':{
      const h=hitObj(wp.x,wp.y,{filter:attachable});
      const a=h?{id:h.o.id,side:nearestSide(h.o,wp)}:{x:wp.x,y:wp.y};
      S.preview=make('conn',{a,b:{x:wp.x,y:wp.y}});drag={mode:'connect',sp};break}
    case 'pen':case 'marker':{
      const P=S.tool==='pen'?PREFS.pen:PREFS.marker;
      S.preview=make('path',{pts:[wp.x,wp.y],color:P.color,sw:P.sw,hl:S.tool==='marker'});drag={mode:'draw'};invalidate();break}
    case 'eraser':drag={mode:'erase',n:0};eraseAt(wp);break;
    case 'emoji':{const o=make('emoji');o.x=wp.x-o.w/2;o.y=wp.y-o.h/2;addObj(o);commit();pop(o);break}
  }
  invalidate();
});
function pop(o){/* pequeña animación al estampar */const w=o.w,h=o.h,cx=o.x+w/2,cy=o.y+h/2;let t=0;const step=()=>{t+=.12;const s=t<1?1+Math.sin(t*Math.PI)*.25:1;o.w=w*s;o.h=h*s;o.x=cx-o.w/2;o.y=cy-o.h/2;invalidate();if(t<1)requestAnimationFrame(step);else{o.w=w;o.h=h;o.x=cx-w/2;o.y=cy-h/2;invalidate()}};step()}

function downSelect(e,sp,wp){
  for(const h of handles()){
    const r=h.k==='ca'||h.k==='cb'?9:7;
    if(Math.abs(h.x-sp.x)<=r&&Math.abs(h.y-sp.y)<=r){
      if(h.k==='ca'||h.k==='cb'){const o=selected()[0];drag={mode:'endpoint',o,end:h.k==='ca'?'a':'b',sp}}
      else{const box=selBox();drag={mode:'resize',k:h.k,box,start:wp,items:selected().filter(o=>!o.locked).map(o=>({o,orig:clone(o)}))}}
      return;
    }
  }
  for(const q of quickAdds()){if(Math.hypot(q.x-sp.x,q.y-sp.y)<=12){drag={mode:'quick',side:q.k,src:selected()[0],sp};return}}
  const h=hitObj(wp.x,wp.y);
  if(h){
    const o=h.o;
    if(o.type==='section'&&h.part==='body'&&!S.sel.has(o.id)){drag={mode:'pending',sec:o,start:wp,sp,shift:e.shiftKey,base:new Set(S.sel)};return}
    if(e.shiftKey){if(S.sel.has(o.id)){S.sel.delete(o.id);scheduleCtx();invalidate();return}S.sel.add(o.id)}
    else if(!S.sel.has(o.id))S.sel=new Set([o.id]);
    drag={mode:'move',start:wp,sp,alt:e.altKey,items:null};scheduleCtx();return;
  }
  if(!e.shiftKey)S.sel.clear();
  drag={mode:'marquee',start:wp,sp,base:new Set(S.sel)};scheduleCtx();
}

function beginMove(){
  if(drag.alt){
    const data=serialize(selected());const made=insertData(data,{dx:0,dy:0,select:true});if(!made.length){drag.mode='none';return}
  }
  const ids=new Set([...S.sel].filter(id=>{const o=get(id);return o&&!o.locked}));
  for(const id of [...ids]){const o=get(id);if(o.type==='section')for(const c of sectionChildren(o,ids))if(!c.locked)ids.add(c.id)}
  drag.items=[...ids].map(id=>({o:get(id),orig:clone(get(id))}));
  const own=selected().filter(o=>!o.locked&&o.type!=='conn');
  drag.box=own.length?unionRects(own.map(bounds)):null;
  drag.T=snapTargets(ids);
}

window.addEventListener('pointermove',e=>{
  const sp=spt(e);
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,sp);
  S.pointer={x:sp.x,y:sp.y,in:e.target===cv,...(()=>{const w=toWorld(sp.x,sp.y);return{wx:w.x,wy:w.y}})()};
  if(!drag){if(e.target===cv)hover(sp);else if(S.hover){S.hover=null;invalidate()}if(S.tool==='eraser')invalidate();return}

function copySel(cut){

}
document.addEventListener('copy',e=>{if(isTyping(e.target)||!S.sel.size)return;const d=copySel(false);e.clipboardData.setData('text/plain','PIZARRA-RT:'+JSON.stringify(d));e.preventDefault()});
document.addEventListener('cut',e=>{if(isTyping(e.target)||!S.sel.size)return;const d=copySel(true);e.clipboardData.setData('text/plain','PIZARRA-RT:'+JSON.stringify(d));e.preventDefault()});
document.addEventListener('paste',e=>{
  if(isTyping(e.target))return;

  const files=[...(e.clipboardData.files||[])].filter(f=>f.type.startsWith('image/'));
  const at=S.pointer.in?{x:S.pointer.wx,y:S.pointer.wy}:null;

  if(t.startsWith('PIZARRA-RT:')){try{const d=JSON.parse(t.slice(11));pasteData(d,at)}catch(_){}return}

function pasteData(d,at){pasteN++;insertData(d,at?{at}:{dx:24*pasteN,dy:24*pasteN});commit()}
function pasteText(t,at){
  const p=at||placeCenter();const o=make('text',{text:t.replace(/\r/g,'').replace(/\n+$/,''),x:p.x,y:p.y});

function textToStickies(o){

  const lines=o.text.split('\n').map(l=>l.replace(/^\s*([-*•·]|\d+[.)])\s*/,'').trim()).filter(Boolean);
  const cols=Math.ceil(Math.sqrt(lines.length)),gap=24,w=200;
  const x0=o.x,y0=o.y;objs().splice(objs().indexOf(o),1);
  const ids=[];lines.forEach((l,i)=>{const s=make('sticky',{text:l,x:x0+(i%cols)*(w+gap),y:y0+Math.floor(i/cols)*(w+gap)});objs().push(s);ids.push(s.id)});
  reindex();S.sel=new Set(ids);commit();
}

function deleteSel(silent){

}
function selectAll(){S.sel=new Set(objs().filter(o=>!o.locked).map(o=>o.id));scheduleCtx();invalidate()}
function zorder(front){

/* ───────── teclado ───────── */
const isTyping=t=>t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
window.addEventListener('keydown',e=>{
  if(isTyping(e.target))return;
  if($('#modal')){if(e.key==='Escape')closeModal();return}
  const k=e.key,mod=e.ctrlKey||e.metaKey,low=k.toLowerCase();
  if(k===' '){if(!e.repeat){spaceDown=true;document.body.classList.add('panning')}e.preventDefault();return}
  if(mod){
    if(low==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
    if(low==='y'){e.preventDefault();redo();return}
    if(low==='d'){e.preventDefault();if(S.sel.size){pasteN=0;const d=serialize(selected());insertData(d,{dx:24,dy:24});commit()}return}
    if(low==='a'){e.preventDefault();selectAll();return}
    if(k===']'){e.preventDefault();zorder(true);return}
    if(k==='['){e.preventDefault();zorder(false);return}
    if(k==='='||k==='+'){e.preventDefault();zoomStep(1);return}
    if(k==='-'){e.preventDefault();zoomStep(-1);return}
    if(k==='0'){e.preventDefault();const c=toWorld(VW/2,VH/2);flyTo({x:c.x-VW/2,y:c.y-VH/2,z:1});return}
    if(k==='\\'){e.preventDefault();toggleSide();return}
    if(low==='l'&&e.shiftKey){e.preventDefault();toggleLock();return}
    if(low==='s'){e.preventDefault();saveFile();return}
    if(low==='o'){e.preventDefault();$('#fileInput').click();return}
    if(low==='e'&&e.shiftKey){e.preventDefault();openExport();return}
    return;
  }
  if(k==='Delete'||k==='Backspace'){e.preventDefault();deleteSel();return}
  if(k==='Escape'){if(S.tool!=='select')setTool('select');else{S.sel.clear();scheduleCtx();invalidate()}closePops();return}
  if(k==='Enter'){const s=selected();if(s.length===1){e.preventDefault();startEdit(s[0],{selectAll:true})}return}
  if(k.startsWith('Arrow')){if(!S.sel.size)return;e.preventDefault();const st=e.shiftKey?10:1;nudge(k==='ArrowLeft'?-st:k==='ArrowRight'?st:0,k==='ArrowUp'?-st:k==='ArrowDown'?st:0);return}
  if(k==='?'||(k==='/'&&e.shiftKey)){openHelp();return}
  if(e.shiftKey){
    if(k==='!'||e.code==='Digit1'){zoomToFit();return}
    if(k==='@'||e.code==='Digit2'||k==='"'){zoomToSel();return}
    if(low==='s'){setTool('section');return}
    if(low==='t'){openTemplates();return}
    return;
  }
  const map={v:'select',h:'hand',s:'sticky',t:'text',l:'connector',x:'connector',p:'pen',m:'marker',e:'eraser',k:'emoji'};
  if(map[low]){setTool(map[low]);return}
  if(low==='r'||low==='o'){PREFS.shapeKind=low==='r'?'rect':'ellipse';savePrefs();setTool('shape');return}
  if(low==='i'){$('#imgInput').click();return}
});

function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}

async function addImageFiles(files,at){
  const p=at||placeCenter();let x=p.x,made=[];
  for(const f of files){
    try{
      let src=await readFile(f),im=await loadImg(src);
      const M=2400;if(Math.max(im.naturalWidth,im.naturalHeight)>M||f.size>2.5e6){
        const s=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);src=f.type==='image/png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.88);if(src.length>4e6)src=c.toDataURL('image/jpeg',.82);im=await loadImg(src)}
      const id='a'+uid();S.board.assets[id]=src;IMG.set(id,im);
      const s=Math.min(1,520/Math.max(im.naturalWidth,im.naturalHeight));
      const o=make('image',{asset:id,w:im.naturalWidth*s,h:im.naturalHeight*s});o.x=x-(made.length?0:o.w/2);o.y=p.y-o.h/2;x=o.x+o.w+24;

}

const SHAPE_SVG={rect:'<rect x="3" y="5" width="18" height="14" rx="1"/>',round:'<rect x="3" y="5" width="18" height="14" rx="4.5"/>',ellipse:'<ellipse cx="12" cy="12" rx="9" ry="7.5"/>',diamond:'<path d="M12 3l9 9-9 9-9-9z"/>',triangle:'<path d="M12 4l9 16H3z"/>',para:'<path d="M7.5 5H21l-4.5 14H3z"/>',hexagon:'<path d="M7.5 4h9l4.5 8-4.5 8h-9L3 12z"/>',star:'<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/>',arrow:'<path d="M3 9h10V5l8 7-8 7v-4H3z"/>',cylinder:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>',bubble:'<path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9l-4 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>'};
const shapeIcon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">${SHAPE_SVG[k]}</svg>`;
const keyTxt=k=>isMac?k:k.replace(/⌘/g,'Ctrl+').replace(/⇧/g,'Shift+').replace(/⌥/g,'Alt+');

const DOCK=[
  ['select','Seleccionar','V'],['hand','Mano','H'],'|',
  ['sticky','Nota adhesiva','S'],['shape','Figura','R'],['text','Texto','T'],['connector','Conector','L'],['section','Sección','⇧S'],'|',
  ['pen','Lápiz','P'],['marker','Marcatextos','M'],['eraser','Borrador','E'],'|',
  ['emoji','Sellos','K'],['image','Imagen','I']];
function renderDock(){
  const d=$('#dock');
  if(!d.children.length){
    d.innerHTML=DOCK.map(t=>t==='|'?'<span class="sep"></span>':`<button class="tool${t[0]==='sticky'?' sticky-tool':''}" data-t="${t[0]}" data-tip="${t[1]}" data-key="${t[2]}" aria-label="${t[1]}"></button>`).join('');
    d.addEventListener('click',e=>{const b=e.target.closest('.tool');if(!b)return;const t=b.dataset.t;
      if(t==='image'){$('#imgInput').click();return}
      if(S.tool===t&&$('#toolOpts').classList.contains('in')&&['select','hand','text','section','eraser'].includes(t))return;
      setTool(t)});
  }
  for(const b of $$('.tool',d)){
    const t=b.dataset.t;b.classList.toggle('on',S.tool===t);
    let ic=t==='shape'?shapeIcon(PREFS.shapeKind):icon(t==='emoji'?'emoji':t);
    let sw='';
    if(t==='sticky')sw=`<i class="sw" style="background:${PREFS.stickyColor}"></i>`;
    if(t==='pen')sw=`<i class="sw" style="background:${PREFS.pen.color}"></i>`;
    if(t==='marker')sw=`<i class="sw" style="background:${PREFS.marker.color}"></i>`;

    const html=ic+sw;if(b._h!==html){b.innerHTML=html;b._h=html}

function swatchRow(list,cur,attr='c'){return`<div class="swatches" style="grid-template-columns:repeat(${Math.min(list.length,11)},26px)">${list.map(s=>{const c=typeof s==='string'?s:s.c,n=typeof s==='string'?s:s.n;return c==='none'?`<button class="swatch chip none${cur==='none'?' cur':''}" data-${attr}="none" data-tip="Sin color"></button>`:`<button class="swatch${cur===c?' cur':''}" data-${attr}="${c}" data-tip="${n}" style="background:${c}"></button>`}).join('')}</div>`}
function renderToolOpts(){

$('#toolOpts').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const t=S.tool;
  if(b.dataset.c){if(t==='sticky')PREFS.stickyColor=b.dataset.c;else if(t==='pen'||t==='marker')PREFS[t].color=b.dataset.c}

/* ───────── popovers y menús ───────── */
let pops=[];
function closePops(){for(const p of pops){p.classList.remove('in');setTimeout(()=>p.remove(),180)}pops=[];hideTip()}
function openPop(anchor,html,{place='auto',cls='',onClick}={}){
  closePops();
  const p=document.createElement('div');p.className='pop '+cls;p.innerHTML=html;document.body.appendChild(p);pops.push(p);
  const a=anchor.getBoundingClientRect?anchor.getBoundingClientRect():{left:anchor.x,top:anchor.y,right:anchor.x,bottom:anchor.y,width:0,height:0};
  const pw=p.offsetWidth,ph=p.offsetHeight;
  let x=a.left+a.width/2-pw/2;x=clamp(x,8,VW-pw-8);
  let y=place==='top'||(place==='auto'&&a.bottom+ph+10>VH)?a.top-ph-8:a.bottom+8;
  if(place==='at'){x=clamp(a.left,8,VW-pw-8);y=a.top+ph>VH-8?Math.max(8,a.top-ph):a.top}
  y=clamp(y,8,VH-ph-8);
  p.style.left=x+'px';p.style.top=y+'px';
  requestAnimationFrame(()=>p.classList.add('in'));
  if(onClick)p.addEventListener('click',e=>onClick(e,p));
  p.addEventListener('pointerdown',e=>e.stopPropagation());
  return p;
}

/* ───────── barra contextual ───────── */
let ctxQueued=false;
function scheduleCtx(){if(ctxQueued)return;ctxQueued=true;queueMicrotask(()=>{ctxQueued=false;buildCtx()})}
const mainColor=o=>({sticky:o.color,shape:o.fill,text:col(o.color),conn:col(o.color),path:col(o.color),section:o.color})[o.type];
function setMainColor(o,c){if(o.type==='sticky')o.color=c;else if(o.type==='shape'){o.fill=c}else if(o.type==='section')o.color=c;else if('color' in o)o.color=c}
function apply(fn){const s=selected().filter(o=>!o.locked);if(!s.length)return;for(const o of s)fn(o);if(S.editing){const e=get(S.editing);if(e)styleEditor(e)}commit();buildCtx()}
function buildCtx(){
  const el=$('#ctx');const s=selected();
  if(!s.length||(S.editing&&['section','conn'].includes((get(S.editing)||{}).type))){el.classList.remove('in');el._key='';return}
  const types=[...new Set(s.map(o=>o.type))],only=types.length===1?types[0]:null,one=s.length===1?s[0]:null;
  const locked=s.every(o=>o.locked);
  const key=JSON.stringify(s.map(o=>[o.id,o.type,o.color,o.fill,o.stroke,o.sw,o.kind,o.fs,o.font,o.bold,o.align,o.style,o.start,o.end,o.dash,o.locked]));
  if(el._key===key&&el.classList.contains('in'))return;el._key=key;
  const B=(act,inner,tip,cls='')=>`<button class="btn ghost ${cls}" data-act="${act}" ${tip?`data-tip="${esc(tip)}"`:''}>${inner}</button>`;
  let h='';
  if(locked){h=B('unlock',icon('unlock')+'<span class="lbl">Desbloquear</span>','Desbloquear')}
  else{

function movables(){return selected().filter(o=>!o.locked&&o.type!=='conn')}
function moveBy(o,dx,dy){const ids=new Set([o.id]);const list=[o];if(o.type==='section')list.push(...sectionChildren(o,ids));for(const x of list)translateObj(x,clone(x),dx,dy)}

  for(const o of s){const b=bounds(o);let dx=0,dy=0;
    if(k==='l')dx=r.x-b.x;if(k==='c')dx=r.x+r.w/2-(b.x+b.w/2);if(k==='r')dx=r.x+r.w-(b.x+b.w);
    if(k==='t')dy=r.y-b.y;if(k==='m')dy=r.y+r.h/2-(b.y+b.h/2);if(k==='b')dy=r.y+r.h-(b.y+b.h);moveBy(o,dx,dy)}commit()}
function distribute(ax){const s=movables();if(s.length<3){toast('Selecciona al menos 3 elementos para distribuir');return}
  const W=ax==='x'?'w':'h';s.sort((a,b)=>bounds(a)[ax]-bounds(b)[ax]);const r=unionRects(s.map(bounds));
  const total=s.reduce((t,o)=>t+bounds(o)[W],0),gap=(r[W]-total)/(s.length-1);let cur=r[ax];
  for(const o of s){const b=bounds(o);moveBy(o,ax==='x'?cur-b.x:0,ax==='y'?cur-b.y:0);cur+=b[W]+gap}commit()}

  s.sort((a,b)=>{const A=bounds(a),B=bounds(b);return Math.abs(A.y-B.y)>Math.min(A.h,B.h)/2?A.y-B.y:A.x-B.x});
  const cols=Math.ceil(Math.sqrt(s.length)),cw=Math.max(...s.map(o=>bounds(o).w)),ch=Math.max(...s.map(o=>bounds(o).h)),g=24;
  s.forEach((o,i)=>{const b=bounds(o);moveBy(o,r.x+(i%cols)*(cw+g)-b.x,r.y+Math.floor(i/cols)*(ch+g)-b.y)});commit()}

function exportCanvas(scope,scale,bgOn){

  let W=(r.w+2*pad)*scale,H=(r.h+2*pad)*scale;
  const k=Math.min(1,14000/Math.max(W,H),Math.sqrt(1.2e8/(W*H)));scale*=k;W=Math.ceil((r.w+2*pad)*scale);H=Math.ceil((r.h+2*pad)*scale);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ed=S.editing;S.editing=null;
  drawScene(c.getContext('2d'),list,{x:r.x-pad,y:r.y-pad,z:scale},W,H,{dpr:1,bg:bgOn,grid:false,index:idx,titles:true});

}

  const m=openModal(`<div class="box-h"><div><h2>Exportar</h2><p>Imagen para compartir o archivo editable para respaldar.</p></div><button class="btn icon ghost" data-close aria-label="Cerrar">${icon('x')}</button></div>
    <img class="preview" id="exPrev" alt="Vista previa">
    <div class="opts"><div class="row"><span>Qué</span><div class="seg" data-k="scope"><button data-v="all">Todo el tablero</button><button data-v="sel" ${hasSel?'':'disabled style="opacity:.35"'}>Selección</button></div></div>
    <div class="row"><span>Escala</span><div class="seg" data-k="scale"><button data-v="1">1×</button><button data-v="2">2×</button><button data-v="3">3×</button></div></div>
    <div class="row"><span>Fondo</span><div class="seg" data-k="bg"><button data-v="1">Con fondo</button><button data-v="0">Transparente</button></div></div></div>
    <div class="actions"><button class="btn" id="exCopy">${icon('clipboard')}Copiar imagen</button><button class="btn primary" id="exPng">${icon('download')}Descargar PNG</button></div>
    <div class="credit" style="justify-content:space-between;flex-wrap:wrap;gap:10px"><div><b>Archivo editable .pizarra</b><span>Para guardarlo en tu carpeta y abrirlo después aquí.</span></div><div style="display:flex;gap:8px"><button class="btn" id="exOpen">${icon('folder')}Abrir</button><button class="btn" id="exSave">${icon('save')}Guardar</button></div></div>`);
  const sync=()=>{for(const g of $$('.seg[data-k]',m)){const k=g.dataset.k;for(const b of $$('button',g))b.classList.toggle('on',String(k==='bg'?+st.bg:st[k])===b.dataset.v)}
    const c=exportCanvas(st.scope,Math.min(1,st.scale),st.bg);const img=$('#exPrev');if(c){img.src=c.toDataURL('image/png');img.hidden=false}else img.hidden=true};
  m.addEventListener('click',e=>{const b=e.target.closest('.seg[data-k] button');if(!b||b.disabled)return;const k=b.parentElement.dataset.k;st[k]=k==='scale'?+b.dataset.v:k==='bg'?b.dataset.v==='1':b.dataset.v;sync()});
  $('#exPng').onclick=async()=>{const c=exportCanvas(st.scope,st.scale,st.bg);if(!c)return toast('No hay nada que exportar');if(await download(await toBlob(c),slug(S.board.name)+'.png'))toast('PNG descargado')};
  $('#exCopy').onclick=()=>copyPNG(st.scope,st.scale,st.bg);
  $('#exSave').onclick=()=>saveFile();$('#exOpen').onclick=()=>{closeModal();$('#fileInput').click()};
  sync();
}
$('#exportBtn').onclick=()=>openExport();

/* ───────── archivos .pizarra ───────── */
async function saveFile(b=S.board){
  if(b===S.board&&saveTimer)await saveNow();
  const assets={};for(const o of b.objects)if(o.type==='image'&&b.assets[o.asset])assets[o.asset]=b.assets[o.asset];
  const data={app:'pizarra-rt',v:1,name:b.name,bg:b.bg,saved:new Date().toISOString(),objects:b.objects,assets};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),name=slug(b.name)+'.pizarra';
  if(window.showSaveFilePicker&&!(await getDownloads())){
    try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:'Tablero de Pizarra',accept:{'application/json':['.pizarra']}}]});const w=await h.createWritable();await w.write(blob);await w.close();toast('Archivo guardado');return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  if(await download(blob,name))toast('Archivo descargado');
}
async function importFile(f){
  try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.objects))throw new Error('formato');
    if(saveTimer)await saveNow();
    const b=newBoard(d.name||f.name.replace(/\.(pizarra|json)$/i,''));b.objects=d.objects;b.assets=d.assets||{};b.bg=d.bg||b.bg;
    await DB.put('boards',b);S.metas.unshift({id:b.id,name:b.name,updated:b.updated,thumb:''});
    await openBoard(b.id,{fit:true});saveNow();toast(`“${b.name}” abierto`);
  }catch(e){console.error(e);toast('Ese archivo no parece un tablero de Pizarra')}
}
$('#fileInput').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f)});

/* ───────── arranque ───────── */
(async function boot(){
  for(const el of $$('[data-i]'))el.outerHTML=icon(el.dataset.i);
  resize();addEventListener('resize',()=>{resize();positionCtx(true)});
  renderDock();renderToolOpts();toggleSide(PREFS.side);toggleMini(PREFS.mini);
  const ok=await DB.open();
  S.metas=(await DB.all('meta').catch(()=>[]))||[];
  const sorted=[...S.metas].sort((a,b)=>b.updated-a.updated);
  const id=PREFS.last&&S.metas.some(m=>m.id===PREFS.last)?PREFS.last:(sorted[0]||{}).id;
  if(id)await openBoard(id);else await createBoard('Mi primera pizarra',welcomeObjects());
  if(!ok)toast('Este navegador no permite guardar aquí; usa Exportar → Guardar archivo.');
  const fl=()=>{LCACHE.clear();FITCACHE.clear();invalidate()};
  Promise.all(['400 20px Outfit','700 20px Outfit','500 20px Caveat','400 20px "JetBrains Mono"'].map(f=>document.fonts.load(f).catch(()=>{}))).then(fl);
  document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',fl);
  addEventListener('visibilitychange',()=>{if(document.hidden&&saveTimer)saveNow()});
  addEventListener('beforeunload',()=>{if(saveTimer)saveNow()});
  setInterval(()=>{if(PREFS.side)renderBoards()},60000);
  cv.focus();
})();

</script>
</body>
